name: Build TWRP with Device Tree

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'TWRP Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      manifest_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12'
      device_tree_url:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/c4x64/SharkRecovery.git'
      device_tree_branch:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'f22'
      lunch_target:
        description: 'Lunch Target'
        required: true
        default: 'twrp_f22-eng'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Maximize disk space
      uses: jlumbroso/free-disk-space@v3
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git curl wget \
          openjdk-17-jdk \
          build-essential \
          bison flex \
          libxml2-utils \
          libncurses5 \
          libncurses5-dev \
          libncurses-dev \
          libssl-dev \
          lib32z1-dev \
          libncurses5:i386 \
          libreadline-dev \
          libreadline8:i386 \
          libstdc++6:i386 \
          lib32z1 \
          lzop \
          m4 \
          patch \
          texinfo \
          unzip \
          zlib1g-dev \
          zlib1g:i386 \
          bc \
          ccache

        # Install repo
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

        # Setup swap
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

        # Cleanup
        sudo apt-get autoremove -y
        sudo apt-get autoclean -y

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ~/android/.ccache
        key: ccache-twrp-${{ github.sha }}
        restore-keys: |
          ccache-twrp-

    - name: Setup build directory
      run: |
        mkdir -p /workspace
        cd /workspace
        echo "Build directory: $(pwd)"
        echo "Disk space:"
        df -h /

    - name: Initialize repo
      run: |
        cd /workspace
        repo init -u "${{ github.event.inputs.manifest_url }}" -b "${{ github.event.inputs.manifest_branch }}" --depth=1
        echo "Repo initialized"

    - name: Sync source
      run: |
        cd /workspace
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
        echo "Source synced"

    - name: Fetch device tree
      run: |
        cd /workspace
        git clone --depth 1 -b "${{ github.event.inputs.device_tree_branch }}" \
          "${{ github.event.inputs.device_tree_url }}" device_tree_temp

        # Copy device tree to correct location
        DEVICE_CODENAME="${{ github.event.inputs.device_codename }}"
        mkdir -p device/samsung
        cp -r device_tree_temp/device device/samsung/${DEVICE_CODENAME}

        # Copy prebuilts and configs
        if [ -d device_tree_temp/prebuilt ]; then
          cp -r device_tree_temp/prebuilt device/samsung/${DEVICE_CODENAME}/
        fi

        if [ -d device_tree_temp/KernelSU ]; then
          cp -r device_tree_temp/KernelSU device/samsung/${DEVICE_CODENAME}/
        fi

        rm -rf device_tree_temp
        echo "Device tree installed"

    - name: Initialize build environment
      run: |
        cd /workspace
        . build/envsetup.sh

        # Verify device exists
        if lunch "${{ github.event.inputs.lunch_target }}" 2>&1 | grep -q "No such product"; then
          echo "ERROR: Device not found!"
          ls device/
          exit 1
        fi

        lunch "${{ github.event.inputs.lunch_target }}"
        echo "Build environment ready"

    - name: Build recovery image
      run: |
        cd /workspace

        # Set up ccache
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        ccache -M 50G
        ccache -z

        # Clean build
        make clean

        # Build recovery
        echo "Starting build..."
        mka recoveryimage -j$(nproc --all) 2>&1 | tee build.log

        # Verify output
        if [ -f out/target/product/${{ github.event.inputs.device_codename }}/recovery.img ]; then
          echo "Build successful!"
          ls -lh out/target/product/${{ github.event.inputs.device_codename }}/recovery.img
        else
          echo "Build failed!"
          tail -100 build.log
          exit 1
        fi

    - name: Extract recovery info
      run: |
        cd /workspace
        RECOVERY_IMG="out/target/product/${{ github.event.inputs.device_codename }}/recovery.img"

        # Basic info
        echo "=== Recovery Image Info ==="
        file "$RECOVERY_IMG"
        ls -lh "$RECOVERY_IMG"

        # Extract kernel info if possible
        echo "=== Build Info ==="
        cat > build_info.txt << EOF
        Build Date: $(date -u)
        Device: ${{ github.event.inputs.device_codename }}
        Recovery: Shark Recovery
        Build Host: GitHub Actions
        Manifest: ${{ github.event.inputs.manifest_url }}
        Branch: ${{ github.event.inputs.manifest_branch }}
        EOF
        cat build_info.txt

    - name: Generate visualization
      run: |
        cd /workspace

        # Create visual representation of build
        cat > recovery_preview.txt << EOF
        ┌─────────────────────────────────────────┐
        │                                         │
        │       🦈 SHARK RECOVERY BUILT 🦈       │
        │                                         │
        │  Device: ${{ github.event.inputs.device_codename }}                    │
        │  Status: ✅ BUILD SUCCESS               │
        │                                         │
        │  Recovery.img: $(ls -lh out/target/product/${{ github.event.inputs.device_codename }}/recovery.img | awk '{print $5}') │
        │                                         │
        │  Ready to flash!                        │
        │                                         │
        └─────────────────────────────────────────┘
        EOF

        cat recovery_preview.txt

        # Create simple PNG using ImageMagick if available
        if command -v convert &> /dev/null; then
          convert -size 800x600 xc:black \
            -gravity center -pointsize 48 -fill cyan \
            -annotate +0-100 "🦈 SHARK RECOVERY" \
            -gravity center -pointsize 32 -fill white \
            -annotate +0-20 "Device: ${{ github.event.inputs.device_codename }}" \
            -gravity center -pointsize 24 -fill lime \
            -annotate +0+20 "Build Successful" \
            build_preview.png
          echo "Preview generated"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shark-recovery-${{ github.event.inputs.device_codename }}-${{ github.sha }}
        path: |
          /workspace/out/target/product/${{ github.event.inputs.device_codename }}/recovery.img
          /workspace/build.log
          /workspace/build_info.txt
          /workspace/recovery_preview.txt
          /workspace/build_preview.png
        retention-days: 30

    - name: Create release
      if: success() && github.event_name == 'workflow_dispatch'
      run: |
        cd /workspace
        RECOVERY_IMG="out/target/product/${{ github.event.inputs.device_codename }}/recovery.img"

        # Create release package
        mkdir -p release
        cp "$RECOVERY_IMG" release/
        cp build_info.txt release/
        cp recovery_preview.txt release/

        cat > release/README.txt << EOF
        Shark Recovery for ${{ github.event.inputs.device_codename }}
        Build Date: $(date -u)
        Device: Samsung Galaxy F22 (SM-E225F)
        Recovery: Shark Recovery with KernelSU

        Installation:
        1. Download recovery.img
        2. Flash via Odin or fastboot
        3. Boot into recovery

        Built with TWRP ${{ github.event.inputs.manifest_branch }}
        EOF

        cd release
        zip -r ../SharkRecovery_${{ github.event.inputs.device_codename }}_$(date +%Y%m%d).zip ./*

        echo "Release package created"
        ls -lh ..

    - name: Upload to releases
      if: success() && github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        files: /workspace/SharkRecovery_${{ github.event.inputs.device_codename }}_*.zip
        tag_name: shark-${{ github.event.inputs.device_codename }}-${{ github.run_number }}
        name: Shark Recovery ${{ github.event.inputs.device_codename }} Build #${{ github.run_number }}
        body: |
          ## Shark Recovery Build

          **Device**: ${{ github.event.inputs.device_codename }}
          **Build Date**: $(date -u)
          **Manifest**: ${{ github.event.inputs.manifest_url }}@${{ github.event.inputs.manifest_branch }}

          ### Artifacts
          - recovery.img
          - Build logs
          - Preview image

          ### Installation
          Flash via Odin or fastboot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
