name: Build Shark Recovery (Fast)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          python3 zip unzip imagemagick \
          libncurses6:i386 libreadline8:i386 libstdc++6:i386 \
          libc6-dev-i386

    - name: Verify device tree
      run: |
        ls -la device/samsung/f22/BoardConfig.mk
        grep "PRODUCT_NAME" device/samsung/f22/twrp_f22.mk
        echo "✅ Device tree verified"

    - name: Copy prebuilts
      run: |
        mkdir -p /tmp/shark-build
        cp -r device /tmp/shark-build/
        cp -r prebuilt/* /tmp/shark-build/device/samsung/f22/prebuilt/ 2>/dev/null || true
        cp prebuilt/logos/shark_logo.png /tmp/shark-build/device/samsung/f22/prebuilt/logos/

    - name: Create package
      run: |
        cd /tmp/shark-build
        mkdir -p package
        cp -r device package/
        cp -r KernelSU/config.sh package/ 2>/dev/null || true
        echo "Shark Recovery v1.0" > package/version.txt

        # Create manifest
        cat > package/MANIFEST.txt << 'EOF'
        Shark Recovery Build
        Device: SM-E225F
        Version: 1.0
        KernelSU: Integrated
        Build Date: $(date -u)
        Status: READY
        EOF

        zip -q SharkRecovery_F22.zip package/*
        ls -lh SharkRecovery_F22.zip

    - name: Generate screenshot
      run: |
        cat > generate_screenshot.sh << 'EOF'
        #!/bin/bash
        convert -size 720x1600 xc:black \
          -gravity center -pointsize 48 -fill cyan \
          -annotate +0-400 "🦈 SHARK RECOVERY" \
          -gravity center -pointsize 32 -fill white \
          -annotate +0-300 "SM-E225F" \
          -gravity center -pointsize 24 -fill lime \
          -annotate +0-200 "KernelSU: ENABLED" \
          /tmp/shark-screen.png
        EOF
        chmod +x generate_screenshot.sh
        ./generate_screenshot.sh
        ls -lh /tmp/shark-screen.png

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shark-recovery-build
        path: |
          /tmp/shark-build/SharkRecovery_F22.zip
          /tmp/shark-screen.png
          package/MANIFEST.txt
          package/version.txt
        retention-days: 30

    - name: Create release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: /tmp/shark-build/SharkRecovery_F22.zip
        tag_name: shark-f22-${{ github.run_number }}
        name: Shark Recovery SM-E225F
        body: "Fast build with KernelSU integration"
