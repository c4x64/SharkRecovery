name: Build TWRP - Fixed Version

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'TWRP Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      manifest_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12'
      device_tree_url:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/c4x64/SharkRecovery.git'
      device_tree_branch:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'f22'
      lunch_target:
        description: 'Lunch Target'
        required: true
        default: 'twrp_f22-eng'

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 480

    steps:
    - name: Maximize disk space
      uses: jlumbroso/free-disk-space@v3
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Display disk space
      run: |
        df -h /
        echo "Available space in bytes:"
        df --output=avail / | tail -1
        echo "In GB:"
        df -BG / | tail -1

    - name: Setup Java and dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install \
          openjdk-8-jdk \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          g++-multilib \
          gcc-multilib \
          git \
          gnupg \
          gperf \
          imagemagick \
          libncurses-dev \
          libncurses5:i386 \
          libreadline-dev \
          libreadline8:i386 \
          lib32z1-dev \
          liblz4-tool \
          libncurses5 \
          libncurses5-dev \
          libssl-dev \
          libxml2 \
          libxml2-utils \
          lzop \
          m4 \
          make \
          patch \
          pngcrush \
          schedtool \
          squashfs-tools \
          texinfo \
          unzip \
          xsltproc \
          zip \
          zlib1g-dev \
          zlib1g:i386 \
          repo

        java -version
        echo "Java setup complete"

    - name: Setup ccache
      run: |
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        export CCACHE_DIR=$HOME/.ccache
        ccache -M 50G
        ccache -o compression=true
        ccache -z
        echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV

    - name: Create workspace
      run: |
        mkdir -p /home/runner/work/shark-build/shark-build
        cd /home/runner/work/shark-build/shark-build
        pwd
        echo "Workspace created"

    - name: Initialize repo
      run: |
        cd /home/runner/work/shark-build/shark-build
        repo init -u "${{ github.event.inputs.manifest_url }}" -b "${{ github.event.inputs.manifest_branch }}" --depth=1 --no-clone-bundle
        echo "Repo initialized successfully"

    - name: Sync source (with progress)
      run: |
        cd /home/runner/work/shark-build/shark-build
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune 2>&1 | tee /tmp/repo_sync.log
        echo "Repo sync completed"
        df -h /

    - name: Fetch device tree
      run: |
        cd /home/runner/work/shark-build/shark-build
        git clone --depth 1 -b "${{ github.event.inputs.device_tree_branch }}" \
          "${{ github.event.inputs.device_tree_url }}" /tmp/device_tree_temp

        DEVICE_CODENAME="${{ github.event.inputs.device_codename }}"
        echo "Device codename: $DEVICE_CODENAME"

        # Create device directory
        mkdir -p device/samsung/${DEVICE_CODENAME}

        # Copy device tree
        cp -r /tmp/device_tree_temp/device/* device/samsung/${DEVICE_CODENAME}/ 2>/dev/null || true

        # Copy prebuilts
        if [ -d /tmp/device_tree_temp/prebuilt ]; then
          cp -r /tmp/device_tree_temp/prebuilt/. device/samsung/${DEVICE_CODENAME}/prebuilt/ 2>/dev/null || true
        fi

        # Copy KernelSU
        if [ -d /tmp/device_tree_temp/KernelSU ]; then
          mkdir -p device/samsung/${DEVICE_CODENAME}/KernelSU
          cp -r /tmp/device_tree_temp/KernelSU/. device/samsung/${DEVICE_CODENAME}/KernelSU/ 2>/dev/null || true
        fi

        # Verify device tree
        ls -la device/samsung/${DEVICE_CODENAME}/
        echo "Device tree installed successfully"

    - name: Setup build environment
      run: |
        cd /home/runner/work/shark-build/shark-build
        . build/envsetup.sh
        echo "Environment setup complete"

        # List available lunch targets
        echo "Available targets:"
        lunch | grep f22 || echo "No f22 targets found"

    - name: Lunch target
      run: |
        cd /home/runner/work/shark-build/shark-build
        . build/envsetup.sh
        lunch "${{ github.event.inputs.lunch_target }}" || true
        echo "Lunch target set"

    - name: Build recovery (with error handling)
      run: |
        cd /home/runner/work/shark-build/shark-build
        . build/envsetup.sh
        lunch "${{ github.event.inputs.lunch_target }}"

        export USE_CCACHE=1
        export CCACHE_DIR=$HOME/.ccache

        # Try build with smaller parallelism
        echo "Starting build with 2 jobs..."
        make recoveryimage -j2 2>&1 | tee /tmp/build.log

        # Check if build succeeded
        if [ -f out/target/product/${{ github.event.inputs.device_codename }}/recovery.img ]; then
          echo "✅ Build successful!"
          ls -lh out/target/product/${{ github.event.inputs.device_codename }}/recovery.img
        else
          echo "❌ Build failed or incomplete"
          echo "Checking for partial builds..."
          find out/target/product/${{ github.event.inputs.device_codename }}/ -name "*.img" 2>/dev/null || echo "No images found"
          echo "Last 200 lines of build log:"
          tail -200 /tmp/build.log
          exit 1
        fi

    - name: Verify build output
      run: |
        cd /home/runner/work/shark-build/shark-build
        RECOVERY_IMG="out/target/product/${{ github.event.inputs.device_codename }}/recovery.img"

        if [ -f "$RECOVERY_IMG" ]; then
          echo "=== Recovery Image ==="
          ls -lh "$RECOVERY_IMG"
          file "$RECOVERY_IMG"
          echo ""
          echo "=== Build Info ==="
          cat > build_info.txt << EOF
          Build Date: $(date -u)
          Device: ${{ github.event.inputs.device_codename }}
          Recovery: Shark Recovery
          Size: $(ls -lh "$RECOVERY_IMG" | awk '{print $5}')
          Status: SUCCESS
          EOF
          cat build_info.txt
        else
          echo "ERROR: recovery.img not found"
          exit 1
        fi

    - name: Create visualization
      run: |
        cat > /tmp/recovery_visual.txt << EOF
        ┌─────────────────────────────────────────┐
        │                                         │
        │      🦈 SHARK RECOVERY BUILT 🦈        │
        │                                         │
        │  Device: ${{ github.event.inputs.device_codename }}                      │
        │  Status: ✅ SUCCESS                     │
        │                                         │
        │  Recovery.img created successfully!    │
        │                                         │
        └─────────────────────────────────────────┘
        EOF
        cat /tmp/recovery_visual.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shark-recovery-${{ github.event.inputs.device_codename }}
        path: |
          /home/runner/work/shark-build/shark-build/out/target/product/${{ github.event.inputs.device_codename }}/recovery.img
          /home/runner/work/shark-build/shark-build/build_info.txt
          /tmp/recovery_visual.txt
          /tmp/build.log
        retention-days: 30
