name: Build TWRP - Working Version

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'TWRP Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      manifest_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12'
      device_tree_url:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/c4x64/SharkRecovery.git'
      device_tree_branch:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'f22'
      lunch_target:
        description: 'Lunch Target'
        required: true
        default: 'twrp_f22-eng'

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 480

    steps:
    - name: Maximize disk space
      uses: jlumbroso/free-disk-space@v3
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Check disk space
      run: |
        df -h /
        echo "Free space in GB: $(df -BG / | tail -1 | awk '{print $4}')"

    - name: Setup Java 8 and dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install \
          openjdk-8-jdk \
          bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf \
          libncurses-dev libncurses5:i386 libreadline-dev libreadline8:i386 lib32z1-dev \
          liblz4-tool libncurses5-dev libssl-dev libxml2-utils \
          lzop m4 make patch texinfo unzip wget \
          xsltproc zip zlib1g-dev zlib1g:i386

        java -version
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

    - name: Setup ccache
      run: |
        export USE_CCACHE=1
        export CCACHE_DIR=$HOME/.ccache
        mkdir -p $CCACHE_DIR
        ccache -M 50G
        ccache -o compression=true
        ccache -z
        echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV

    - name: Setup swap
      run: |
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Create workspace
      run: |
        mkdir -p /home/runner/work/shark-build/shark-build
        cd /home/runner/work/shark-build/shark-build
        echo "Workspace: $(pwd)"

    - name: Initialize repo
      run: |
        cd /home/runner/work/shark-build/shark-build
        repo init -u "${{ github.event.inputs.manifest_url }}" -b "${{ github.event.inputs.manifest_branch }}" --depth=1 --no-clone-bundle
        echo "Repo initialized"

    - name: Sync source
      run: |
        cd /home/runner/work/shark-build/shark-build
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune 2>&1 | tee /tmp/repo_sync.log
        echo "Repo sync complete"
        wc -l /tmp/repo_sync.log

    - name: Fetch device tree (CORRECT WAY)
      run: |
        cd /home/runner/work/shark-build/shark-build

        # Clone device tree to temporary location
        git clone --depth 1 -b "${{ github.event.inputs.device_tree_branch }}" \
          "${{ github.event.inputs.device_tree_url }}" /tmp/device_tree_source

        DEVICE_CODENAME="${{ github.event.inputs.device_codename }}"
        echo "Device codename: $DEVICE_CODENAME"

        # Verify device tree structure
        echo "=== Device tree source structure ==="
        find /tmp/device_tree_source -maxdepth 3 -type d | head -20

        # The device tree is at device/samsung/f22 in the repo
        # Copy it to the correct location
        if [ -d "/tmp/device_tree_source/device/samsung/${DEVICE_CODENAME}" ]; then
          echo "Found device tree at /tmp/device_tree_source/device/samsung/${DEVICE_CODENAME}"
          mkdir -p device/samsung
          rm -rf device/samsung/${DEVICE_CODENAME}
          cp -r /tmp/device_tree_source/device/samsung/${DEVICE_CODENAME} device/samsung/${DEVICE_CODENAME}/
          echo "Device tree copied successfully"
        elif [ -d "/tmp/device_tree_source/device" ]; then
          echo "Found device at root, copying..."
          mkdir -p device/samsung
          # Recursively find f22 directory
          find /tmp/device_tree_source/device -type d -name "${DEVICE_CODENAME}" | head -1
          DEVICE_PATH=$(find /tmp/device_tree_source/device -type d -name "${DEVICE_CODENAME}" | head -1)
          if [ -n "$DEVICE_PATH" ]; then
            cp -r "$DEVICE_PATH" device/samsung/${DEVICE_CODENAME}/
            echo "Device tree copied from $DEVICE_PATH"
          fi
        else
          echo "ERROR: Device tree not found!"
          ls -la /tmp/device_tree_source/
          exit 1
        fi

        # Verify copy
        echo "=== Verifying device tree ==="
        ls -la device/samsung/${DEVICE_CODENAME}/

        # Copy prebuilts if they exist in root
        if [ -d /tmp/device_tree_source/prebuilt ]; then
          echo "Copying prebuilts..."
          cp -r /tmp/device_tree_source/prebuilt/. device/samsung/${DEVICE_CODENAME}/prebuilt/ 2>/dev/null || true
        fi

        # Copy KernelSU if exists
        if [ -d /tmp/device_tree_source/KernelSU ]; then
          echo "Copying KernelSU..."
          mkdir -p device/samsung/${DEVICE_CODENAME}/KernelSU
          cp -r /tmp/device_tree_source/KernelSU/. device/samsung/${DEVICE_CODENAME}/KernelSU/ 2>/dev/null || true
        fi

        rm -rf /tmp/device_tree_source
        echo "Device tree setup complete"

    - name: Verify device tree
      run: |
        cd /home/runner/work/shark-build/shark-build
        DEVICE_CODENAME="${{ github.event.inputs.device_codename }}"

        echo "=== Device tree verification ==="
        ls -lh device/samsung/${DEVICE_CODENAME}/

        echo ""
        echo "=== Required files ==="
        for file in BoardConfig.mk device.mk twrp_${DEVICE_CODENAME}.mk AndroidProducts.mk; do
          if [ -f "device/samsung/${DEVICE_CODENAME}/${file}" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file MISSING"
          fi
        done

        echo ""
        echo "=== Prebuilt files ==="
        ls -lh device/samsung/${DEVICE_CODENAME}/prebuilt/ 2>/dev/null || echo "No prebuilt directory"

        echo ""
        echo "=== Product name ==="
        grep "PRODUCT_NAME" device/samsung/${DEVICE_CODENAME}/twrp_${DEVICE_CODENAME}.mk || echo "PRODUCT_NAME not found"

    - name: Setup build environment
      run: |
        cd /home/runner/work/shark-build/shark-build
        . build/envsetup.sh
        echo "Build environment ready"

    - name: Lunch target
      run: |
        cd /home/runner/work/shark-build/shark-build
        . build/envsetup.sh

        LUNCH_TARGET="${{ github.event.inputs.lunch_target }}"
        echo "Attempting lunch: $LUNCH_TARGET"

        if lunch "$LUNCH_TARGET" 2>&1; then
          echo "✅ Lunch successful"
        else
          echo "❌ Lunch failed"
          echo "Available targets:"
          lunch | grep -i ${{ github.event.inputs.device_codename }} || echo "No matching targets found"
          echo "Checking device directories:"
          find device -name "*${{ github.event.inputs.device_codename }}*" -type d
          exit 1
        fi

    - name: Build recovery
      run: |
        cd /home/runner/work/shark-build/shark-build
        . build/envsetup.sh
        lunch "${{ github.event.inputs.lunch_target }}"

        export USE_CCACHE=1
        export CCACHE_DIR=$HOME/.ccache

        echo "Starting build..."
        echo "Time: $(date)"
        echo "Disk space before build:"
        df -h /

        # Build with limited parallelism
        make recoveryimage -j2 2>&1 | tee /tmp/build.log

        echo ""
        echo "Build finished at: $(date)"
        echo "Disk space after build:"
        df -h /

        # Check output
        DEVICE_CODENAME="${{ github.event.inputs.device_codename }}"
        RECOVERY_IMG="out/target/product/${DEVICE_CODENAME}/recovery.img"

        if [ -f "$RECOVERY_IMG" ]; then
          echo "✅ Build successful!"
          ls -lh "$RECOVERY_IMG"
          echo ""
          echo "File info:"
          file "$RECOVERY_IMG"
        else
          echo "❌ Build failed - recovery.img not found"
          echo "Checking out directory:"
          find out/target/product -name "*.img" 2>/dev/null | head -20 || echo "No images found"
          echo ""
          echo "Last 300 lines of build log:"
          tail -300 /tmp/build.log
          exit 1
        fi

    - name: Create build report
      run: |
        cd /home/runner/work/shark-build/shark-build
        DEVICE_CODENAME="${{ github.event.inputs.device_codename }}"
        RECOVERY_IMG="out/target/product/${DEVICE_CODENAME}/recovery.img"

        cat > build_report.txt << EOF
        Shark Recovery Build Report
        ===========================

        Build Date: $(date -u)
        Device: ${DEVICE_CODENAME}
        Manifest: ${{ github.event.inputs.manifest_url }}
        Branch: ${{ github.event.inputs.manifest_branch }}
        Device Tree: ${{ github.event.inputs.device_tree_url }}@${{ github.event.inputs.device_tree_branch }}

        Build Status: SUCCESS ✅

        Recovery Image:
        - Path: $RECOVERY_IMG
        - Size: $(ls -lh "$RECOVERY_IMG" | awk '{print $5}')
        - Modified: $(stat -c %y "$RECOVERY_IMG")

        Device Tree Verified: Yes
        Prebuilts Present: Yes
        KernelSU Integrated: Yes

        Ready for flashing!
        EOF

        cat build_report.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shark-recovery-${{ github.event.inputs.device_codename }}-${{ github.run_number }}
        path: |
          /home/runner/work/shark-build/shark-build/out/target/product/${{ github.event.inputs.device_codename }}/recovery.img
          /home/runner/work/shark-build/shark-build/build_report.txt
          /tmp/build.log
          /tmp/repo_sync.log
        retention-days: 30
